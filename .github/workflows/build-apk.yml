name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: GitHub repo Settings -> Secrets and variables -> Actions me
      # SUPABASE_URL aur SUPABASE_ANON_KEY daalo, tab APK Supabase se judi hogi.
      - name: Write secrets.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > secrets.properties

      - name: Build debug APK
        env:
          GFCHAT_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Scooter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Phone se seedha download karne ke liye: Releases -> "latest" -> Scooter.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Scooter.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Scooter.apk --prerelease \
            --title "Scooter latest build" \
            --notes "Debug APK. Commit: ${{ github.sha }}"
